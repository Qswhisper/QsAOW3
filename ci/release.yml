# Review and copy to .github/workflows/release.yml to enable manual releases.
name: Release APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.1
        required: true
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android tools
        run: sdkmanager "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Verify rules and input
        run: |
          python3 tools/test.py
          python3 tools/fetch_base.py
          python3 tools/verify.py
      - name: Build signed APK
        env:
          QSAOW3_KEYSTORE_B64: ${{ secrets.QSAOW3_KEYSTORE_B64 }}
          QSAOW3_STORE_PASSWORD: ${{ secrets.QSAOW3_STORE_PASSWORD }}
          QSAOW3_KEY_PASSWORD: ${{ secrets.QSAOW3_KEY_PASSWORD }}
          QSAOW3_KEY_ALIAS: ${{ secrets.QSAOW3_KEY_ALIAS }}
        run: |
          python3 -c 'import base64,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"release.keystore"; p.write_bytes(base64.b64decode(os.environ["QSAOW3_KEYSTORE_B64"])); p.chmod(0o600)'
          python3 tools/build.py --keystore "$RUNNER_TEMP/release.keystore" --output dist/QsAOW3.apk
          python3 tools/verify.py --apk dist/QsAOW3.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?",os.environ["RELEASE_TAG"])'
          sha256sum dist/QsAOW3.apk > dist/SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "QsAOW3 $RELEASE_TAG" --generate-notes dist/QsAOW3.apk dist/QsAOW3.build.json dist/SHA256SUMS.txt
